<div class="container mt-5" style="max-width: 400px;">
  <h3 class="mb-3 text-center">Login</h3>
  
  <!-- Demo credentials info -->
  <div class="alert alert-info mb-3">
    <strong>Demo Credentials:</strong><br>
    Username: <code>admin</code> | Password: <code>admin123</code><br>
    Username: <code>user</code> | Password: <code>password</code>
  </div>
  
  <form (ngSubmit)="login()">
    <div class="mb-3">
      <input type="text" [(ngModel)]="username" name="username" class="form-control" placeholder="Username" required [disabled]="isLoading">
    </div>
    <div class="mb-3">
      <input type="password" [(ngModel)]="password" name="password" class="form-control" placeholder="Password"
        required [disabled]="isLoading">
    </div>
    <button type="submit" class="btn btn-primary w-100" [disabled]="isLoading">
      <span *ngIf="isLoading">Logging in...</span>
      <span *ngIf="!isLoading">Login</span>
    </button>
  </form>
  <div *ngIf="errorMsg" class="alert alert-danger mt-3">{{ errorMsg }}</div>
</div>
