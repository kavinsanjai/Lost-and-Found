<div class="d-flex flex-column vh-100">

  <!-- Header -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <button class="btn btn-outline-light me-3" (click)="toggleSidebar()" title="Toggle Sidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <a class="navbar-brand" href="#">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="me-2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <circle cx="9" cy="9" r="2"></circle>
          <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path>
        </svg>
        My Dashboard
      </a>
      <div class="d-flex align-items-center">
        <div class="me-3 text-light">
          <small>Welcome back, Admin</small>
        </div>
        <button class="btn btn-outline-light" (click)="logout()" title="Logout">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="me-1">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16,17 21,12 16,7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          Logout
        </button>
      </div>
    </div>
  </nav>

  <div class="d-flex flex-grow-1">

    <!-- Sidebar -->
    <div [ngClass]="{'d-none': !showSidebar}" class="bg-light border-end p-3" style="min-width: 250px;">
      <h5 class="text-primary">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="me-2">
          <line x1="8" y1="6" x2="21" y2="6"></line>
          <line x1="8" y1="12" x2="21" y2="12"></line>
          <line x1="8" y1="18" x2="21" y2="18"></line>
          <line x1="3" y1="6" x2="3.01" y2="6"></line>
          <line x1="3" y1="12" x2="3.01" y2="12"></line>
          <line x1="3" y1="18" x2="3.01" y2="18"></line>
        </svg>
        Navigation Menu
      </h5>
      <ul class="nav flex-column">
        <li class="nav-item mb-2">
          <a class="nav-link active" routerLink="dashboard1" routerLinkActive="active">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="me-2">
              <rect x="3" y="3" width="7" height="7"></rect>
              <rect x="14" y="3" width="7" height="7"></rect>
              <rect x="14" y="14" width="7" height="7"></rect>
              <rect x="3" y="14" width="7" height="7"></rect>
            </svg>
            Dashboard
          </a>
        </li>
        <li class="nav-item mb-2">
          <a class="nav-link" routerLink="profile" routerLinkActive="active">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="me-2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            Profile
          </a>
        </li>
        <li class="nav-item mb-2">
          <a class="nav-link" routerLink="register_complaint" routerLinkActive="active">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="me-2">
              <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"></path>
              <circle cx="12" cy="13" r="3"></circle>
            </svg>
            Register Complaint
          </a>
        </li>
        <li class="nav-item mb-2">
          <a class="nav-link" routerLink="complaints" routerLinkActive="active">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="me-2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14,2 14,8 20,8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
              <polyline points="10,9 9,9 8,9"></polyline>
            </svg>
            Reports
          </a>
        </li>
        <li class="nav-item mb-2">
          <a class="nav-link" href="#" routerLinkActive="active">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="me-2">
              <path d="M12 20h9"></path>
              <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
            </svg>
            Settings
          </a>
        </li>
      </ul>
      
      <!-- Quick Stats -->
      <div class="mt-4 p-3 bg-white rounded" style="border: 1px solid rgba(102, 126, 234, 0.1);">
        <h6 class="text-muted mb-2">Quick Stats</h6>
        <div class="d-flex justify-content-between mb-1">
          <small>Active Users</small>
          <small class="text-primary fw-bold">1,234</small>
        </div>
        <div class="d-flex justify-content-between mb-1">
          <small>Total Complaints</small>
          <small class="text-warning fw-bold">567</small>
        </div>
        <div class="d-flex justify-content-between">
          <small>Resolved</small>
          <small class="text-success fw-bold">89%</small>
        </div>
      </div>
    </div>

    <!-- Main Content -->
    <div class="flex-grow-1 p-4 overflow-auto">
      <router-outlet></router-outlet>
    </div>

  </div>

  <!-- Footer -->
  <footer class="bg-dark text-light text-center p-3 mt-auto">
    <div class="d-flex justify-content-between align-items-center">
      <div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="me-1">
          <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path>
        </svg>
        &copy; 2025 My App. All rights reserved.
      </div>
      <div class="d-flex gap-3">
        <small>Version 2.1.0</small>
        <small>•</small>
        <small>Last updated: Today</small>
      </div>
    </div>
  </footer>

</div>
