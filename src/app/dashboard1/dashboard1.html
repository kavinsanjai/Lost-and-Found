<div class="dashboard-row">

  <div class="dashboard-chart">
    <h3>Total Lost & Found</h3>
    <ngx-charts-pie-chart
      [view]="view"
      [results]="chartData"
      [doughnut]="true"
      [legend]="true"
      [labels]="true"
      [scheme]="colorScheme">
    </ngx-charts-pie-chart>
  </div>

  <div class="dashboard-chart">
    <h3>Reports by Department</h3>
    <ngx-charts-pie-chart
      [view]="view"
      [results]="departmentData"
      [doughnut]="true"
      [legend]="true"
      [labels]="true"
      [scheme]="colorScheme">
    </ngx-charts-pie-chart>
  </div>

  <div class="dashboard-chart">
    <h3>Reports by Category</h3>
    <ngx-charts-pie-chart
      [view]="view"
      [results]="categoryData"
      [doughnut]="true"
      [legend]="true"
        [labels]="true"
      [scheme]="colorScheme">
    </ngx-charts-pie-chart>
  </div>

</div>
